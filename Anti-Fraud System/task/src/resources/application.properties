spring.application.name=anti-fraud-system
server.port=28852
server.error.include-message=always

# Expose only safe actuator endpoints; never expose shutdown in production
management.endpoints.web.exposure.include=health,info
management.endpoint.shutdown.enabled=false

spring.jackson.serialization.INDENT_OUTPUT=true

#datasource settings
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:file:~/service_db
spring.datasource.username=sa
# Use environment variable DB_PASSWORD; falls back to default for local dev
spring.datasource.password=${DB_PASSWORD:abc123}

#data settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

#console settings — disable in production; enable via dev profile only
spring.h2.console.enabled=false
spring.h2.console.settings.trace=false
spring.h2.console.path=/h2
spring.jpa.show-sql=false
